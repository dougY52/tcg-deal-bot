name: TCG Cloud Watch
# Five-minute schedule plus existing external dispatch; state prevents duplicate scans.
on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths: ['tcg_bot/**', 'config/config.json', 'cloudflare/mms-reader/**', 'scripts/check_local_retail.py', '.github/workflows/cloud-watch.yml']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Nur prüfen, keine Discord-Nachrichten senden'
        type: boolean
        default: true
permissions:
  contents: write
  id-token: write
concurrency:
  group: tcg-retail-watch
  cancel-in-progress: false
jobs:
  cloud-reader-check:
    # Independent deployment diagnostic: failures are visible, scanner still runs.
    if: github.event.repository.private == false && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact products through authenticated cloud reader (no Discord)
        env:
          TCG_CLOUD_READER_URL: https://tcg-mms-reader.tcg-deal-bot-dougy52.workers.dev/read
        run: |
          python -m scripts.check_cloud_reader
          python -m scripts.check_local_retail
  watch:
    needs: cloud-reader-check
    # Public repositories + standard Linux runner: free. Fail closed for private repos.
    if: always() && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser for configured live checkout validation
        run: |
          python -m pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Test and validate
        run: |
          node cloudflare/mms-reader/test.mjs
          python -m unittest discover -s tests -v
          python -m tcg_bot --check-config
      - name: Restore durable state
        run: |
          set -euo pipefail
          remote_ref=$(git ls-remote --heads origin refs/heads/bot-state)
          if [ -n "$remote_ref" ]; then
            git fetch --no-tags --depth=1 origin refs/heads/bot-state
            git show FETCH_HEAD:state.json > state.json
            git worktree add --detach ../tcg-state FETCH_HEAD
          else
            git worktree add --detach ../tcg-state HEAD
            git -C ../tcg-state switch --orphan bot-state
          fi
      - name: Check shops and notify
        id: scan
        env:
          TCG_BROWSER: '1'
          TCG_CLOUD_READER_URL: https://tcg-mms-reader.tcg-deal-bot-dougy52.workers.dev/read
          TCG_CLOUD_READER_TOKEN: ${{ secrets.TCG_CLOUD_READER_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          args=()
          if [ "$DRY_RUN" != "true" ]; then args+=(--send); fi
          python -m tcg_bot "${args[@]}"
      - name: Persist state even after partial send or source failure
        if: ${{ always() && steps.scan.outcome != 'skipped' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          set -euo pipefail
          if [ ! -f state.json ] || [ ! -d ../tcg-state ]; then exit 0; fi
          cp state.json ../tcg-state/state.json
          cd ../tcg-state
          git config user.name 'tcg-retail-watch[bot]'
          git config user.email 'tcg-retail-watch[bot]@users.noreply.github.com'
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update observed stock and delivered alerts'
            git push origin HEAD:refs/heads/bot-state
          fi
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcg-scan-report
          path: report.json
          retention-days: 3
          if-no-files-found: ignore
