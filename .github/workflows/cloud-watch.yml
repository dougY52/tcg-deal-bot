name: TCG Cloud Watch
# Independent cloud schedule registered 2026-09-19
on:
  schedule:
    - cron: '6,16,26,36,46,56 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/cloud-watch.yml']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Nur prüfen, keine Discord-Nachrichten senden'
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: tcg-retail-watch
  cancel-in-progress: false
jobs:
  watch:
    # Public repositories + standard Linux runner: free. Fail closed for private repos.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser for MediaMarkt and Saturn
        if: vars.TCG_BROWSER == '1'
        run: |
          python -m pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Test and validate
        run: |
          python -m unittest discover -s tests -v
          python -m tcg_bot --check-config
      - name: Restore durable state
        run: |
          set -euo pipefail
          remote_ref=$(git ls-remote --heads origin refs/heads/bot-state)
          if [ -n "$remote_ref" ]; then
            git fetch --no-tags origin refs/heads/bot-state
            git show FETCH_HEAD:state.json > state.json
            git worktree add --detach ../tcg-state FETCH_HEAD
          else
            git worktree add --detach ../tcg-state HEAD
            git -C ../tcg-state switch --orphan bot-state
          fi
      - name: Check shops and notify
        id: scan
        env:
          TCG_BROWSER: ${{ vars.TCG_BROWSER }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          args=()
          if [ "$DRY_RUN" != "true" ]; then args+=(--send); fi
          python -m tcg_bot "${args[@]}"
      - name: Persist state even after partial send or source failure
        if: ${{ always() && steps.scan.outcome != 'skipped' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          set -euo pipefail
          if [ ! -f state.json ] || [ ! -d ../tcg-state ]; then exit 0; fi
          cp state.json ../tcg-state/state.json
          cd ../tcg-state
          git config user.name 'tcg-retail-watch[bot]'
          git config user.email 'tcg-retail-watch[bot]@users.noreply.github.com'
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update observed stock and delivered alerts'
            git push origin HEAD:refs/heads/bot-state
          fi
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcg-scan-report
          path: report.json
          retention-days: 3
          if-no-files-found: ignore
