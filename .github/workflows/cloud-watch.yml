name: TCG Cloud Watch
# Five-minute schedule plus existing external dispatch; state prevents duplicate scans.
on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths: ['tcg_bot/**', 'config/config.json', 'config/pokemon-center-de.json', 'config/price-comparison.json', 'cloudflare/mms-reader/**', 'scripts/configure_cardpal_relay.py', 'scripts/audit_cardpal.py', 'scripts/audit_cardpal_catalog.py', 'scripts/audit_price_delivery.py', 'scripts/check_local_retail.py', 'scripts/check_pokemon_center.py', 'scripts/watch_pokemon_center_de.py', 'tests/test_pokemon_center_watch.py', 'tests/test_cardpal_discovery.py', '.github/workflows/cloud-watch.yml']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Nur prüfen, keine Discord-Nachrichten senden'
        type: boolean
        default: true
      pc_access_test:
        description: 'Optionaler Pokémon-Center-Zugriffstest (bis 250 Gratis-Credits)'
        type: boolean
        default: false
      cardpal_connect:
        description: 'CardPal an eigenen Cloudflare-Relay anbinden (keine Testnachricht)'
        type: boolean
        default: false
      cardpal_access_test:
        description: 'CardPal-Konto und Ereignis-Stream nur lesen, keine Discord-Nachrichten'
        type: boolean
        default: false
permissions:
  contents: write
  id-token: write
concurrency:
  group: ${{ (inputs.cardpal_connect || contains(github.event.head_commit.message, '[cardpal-connect]')) && 'tcg-cardpal-connect' || (inputs.cardpal_access_test || contains(github.event.head_commit.message, '[cardpal-audit]')) && 'tcg-cardpal-audit' || 'tcg-retail-watch' }}
  cancel-in-progress: false
jobs:
  cardpal-connect:
    name: CardPal Cloud-Relay verbinden
    if: github.event.repository.private == false && ((github.event_name == 'workflow_dispatch' && inputs.cardpal_connect) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[cardpal-connect]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify relay filters and persistent deduplication
        run: |
          node cloudflare/mms-reader/cardpal-test.mjs
          python -m unittest discover -s tests -p test_cardpal_relay_setup.py -v
          python -m unittest discover -s tests -p test_cardpal_discovery.py -v
      - name: Transfer secrets only to own authenticated Worker and check stream
        env:
          CARDPAL_EMAIL: ${{ secrets.CARDPAL_EMAIL }}
          CARDPAL_PASSWORD: ${{ secrets.CARDPAL_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m scripts.configure_cardpal_relay
      - name: Check current Pokemon retailer discovery without Discord
        run: python -m scripts.audit_cardpal_catalog
  cardpal-access:
    name: CardPal Verbindung prüfen (ohne Discord)
    if: github.event.repository.private == false && ((github.event_name == 'workflow_dispatch' && inputs.cardpal_access_test) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[cardpal-audit]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test safe CardPal transport and evidence handling
        run: python -m unittest discover -s tests -p test_cardpal.py -v
      - name: Inspect owner inbox and stream without changing settings
        env:
          CARDPAL_EMAIL: ${{ secrets.CARDPAL_EMAIL }}
          CARDPAL_PASSWORD: ${{ secrets.CARDPAL_PASSWORD }}
        run: python -m scripts.audit_cardpal
      - name: Save sanitized connection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardpal-access-report
          path: cardpal-access-report.json
          retention-days: 1
          if-no-files-found: ignore
  pokemon-center-de:
    # Starts independently of the broad scanner and its browser diagnostics.
    name: Pokémon Center Deutschland
    if: github.event.repository.private == false && !inputs.cardpal_connect && !contains(github.event.head_commit.message, '[cardpal-connect]') && !inputs.cardpal_access_test && !contains(github.event.head_commit.message, '[cardpal-audit]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Germany-only alerts
        run: python -m unittest discover -s tests -p 'test_pokemon_center_*.py' -v
      - name: Restore independent Pokemon Center state
        run: |
          set -euo pipefail
          remote_ref=$(git ls-remote --heads origin refs/heads/pokemon-center-state)
          if [ -n "$remote_ref" ]; then
            git fetch --no-tags --depth=1 origin refs/heads/pokemon-center-state
            git show FETCH_HEAD:state.json > pokemon-center-state.json
            git worktree add --detach ../pokemon-center-state FETCH_HEAD
          else
            git worktree add --detach ../pokemon-center-state HEAD
            git -C ../pokemon-center-state switch --orphan pokemon-center-state
            # Carry forward existing community receipts; no duplicate migration alerts.
            previous=$(git ls-remote --heads origin refs/heads/bot-state)
            if [ -n "$previous" ]; then
              git fetch --no-tags --depth=1 origin refs/heads/bot-state
              git show FETCH_HEAD:state.json > previous-tcg-state.json
              python -c 'import json; from pathlib import Path; old=json.loads(Path("previous-tcg-state.json").read_text()); Path("pokemon-center-state.json").write_text(json.dumps({"version":1,"offers":{},"community_watch":old.get("community_watch",{"sources":{},"delivered":{}})}))'
            fi
          fi
      - name: Check only Pokemon Center Germany and notify
        id: pc_scan
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          args=()
          if [ "$DRY_RUN" != "true" ]; then args+=(--send); fi
          python -m scripts.watch_pokemon_center_de "${args[@]}"
      - name: Persist Pokemon Center receipts and source health
        if: ${{ always() && steps.pc_scan.outcome != 'skipped' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          set -euo pipefail
          if [ ! -f pokemon-center-state.json ] || [ ! -d ../pokemon-center-state ]; then exit 0; fi
          cp pokemon-center-state.json ../pokemon-center-state/state.json
          if [ -f pokemon-center-report.json ]; then cp pokemon-center-report.json ../pokemon-center-state/report.json; fi
          cd ../pokemon-center-state
          git config user.name 'pokemon-center-watch[bot]'
          git config user.email 'pokemon-center-watch[bot]@users.noreply.github.com'
          git add state.json
          if [ -f report.json ]; then git add report.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update Pokemon Center DE signals and Discord receipts'
            git push origin HEAD:refs/heads/pokemon-center-state
          fi
  cloud-reader-check:
    # Independent deployment diagnostic: failures are visible, scanner still runs.
    if: github.event.repository.private == false && !inputs.cardpal_connect && !contains(github.event.head_commit.message, '[cardpal-connect]') && !inputs.cardpal_access_test && !contains(github.event.head_commit.message, '[cardpal-audit]') && !contains(github.event.head_commit.message, '[delivery-audit]') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.pc_access_test)))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact products through authenticated cloud reader (no Discord)
        env:
          TCG_CLOUD_READER_URL: https://tcg-mms-reader.tcg-deal-bot-dougy52.workers.dev/read
        run: |
          python -m scripts.check_cloud_reader
          python -m scripts.check_local_retail
      - name: Verify additional public shop adapters (no Discord)
        if: ${{ !cancelled() }}
        run: python -m scripts.check_added_retailers
      - name: Upload additional retailer diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: added-retailer-audit
          path: added-retailer-audit.json
          retention-days: 3
          if-no-files-found: ignore
      - name: Probe public Pokemon Center Germany access (no Discord)
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.pc_access_test }}
        env:
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
        run: python -m scripts.check_pokemon_center
      - name: Upload Pokemon Center access diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-center-access
          path: pokemon-center-access-report.json
          retention-days: 3
          if-no-files-found: ignore
  watch:
    needs: cloud-reader-check
    # Public repositories + standard Linux runner: free. Fail closed for private repos.
    if: always() && github.event.repository.private == false && !inputs.cardpal_connect && !contains(github.event.head_commit.message, '[cardpal-connect]') && !inputs.cardpal_access_test && !contains(github.event.head_commit.message, '[cardpal-audit]')
    runs-on: ubuntu-24.04
    env:
      TCG_BROWSER_CHANNEL: chrome
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-browser.txt
      - name: Verify preinstalled Chrome for live checkout validation
        timeout-minutes: 3
        run: |
          python -m pip install --timeout 30 --retries 2 -r requirements-browser.txt
          python -m scripts.check_browser_runtime
      - name: Test and validate
        run: |
          node cloudflare/mms-reader/test.mjs
          node cloudflare/mms-reader/cardpal-test.mjs
          python -m unittest discover -s tests -v
          python -m tcg_bot --check-config
      - name: Restore durable state
        run: |
          set -euo pipefail
          remote_ref=$(git ls-remote --heads origin refs/heads/bot-state)
          if [ -n "$remote_ref" ]; then
            git fetch --no-tags --depth=1 origin refs/heads/bot-state
            git show FETCH_HEAD:state.json > state.json
            git worktree add --detach ../tcg-state FETCH_HEAD
          else
            git worktree add --detach ../tcg-state HEAD
            git -C ../tcg-state switch --orphan bot-state
          fi
      - name: Check shops and notify
        id: scan
        env:
          TCG_BROWSER: '1'
          TCG_CLOUD_READER_URL: https://tcg-mms-reader.tcg-deal-bot-dougy52.workers.dev/read
          TCG_CLOUD_READER_TOKEN: ${{ secrets.TCG_CLOUD_READER_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          args=()
          if [ "$DRY_RUN" != "true" ]; then args+=(--send); fi
          python -m tcg_bot "${args[@]}"
      - name: Persist state even after partial send or source failure
        if: ${{ always() && steps.scan.outcome != 'skipped' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          set -euo pipefail
          if [ ! -f state.json ] || [ ! -d ../tcg-state ]; then exit 0; fi
          cp state.json ../tcg-state/state.json
          cd ../tcg-state
          git config user.name 'tcg-retail-watch[bot]'
          git config user.email 'tcg-retail-watch[bot]@users.noreply.github.com'
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update observed stock and delivered alerts'
            git push origin HEAD:refs/heads/bot-state
          fi
      - name: Audit current comparisons and existing Discord receipts (read only)
        if: github.event_name == 'push'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m scripts.audit_price_delivery
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcg-scan-report
          path: |
            report.json
            price-delivery-audit.json
          retention-days: 3
          if-no-files-found: ignore
