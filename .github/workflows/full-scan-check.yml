name: Full catalog scan check
on:
  push:
    branches: [main]
    paths:
      - 'config/config.json'
      - 'tcg_bot/**'
      - '.github/workflows/watch.yml'
      - '.github/workflows/full-scan-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -q
      - name: Read all configured catalogs without Discord or state writes
        run: |
          python - <<'PY'
          import json, time
          from pathlib import Path
          from tcg_bot.__main__ import load_config, run, summary, ADAPTERS
          from tcg_bot.fast_watch import run as fast_run
          from tcg_bot.http import Client
          cfg = load_config('config/config.json')
          # Include staged sources in this read-only qualification run.
          for shop in cfg['shops']:
              if shop.get('audit_checked_on'):
                  shop['enabled'] = True
          start = time.monotonic()
          client = Client()
          try:
              audit_state = {'version': 1, 'offers': {}}
              report = run(cfg, audit_state, client)
          finally:
              client.close()
          elapsed = time.monotonic() - start
          Path('scan-check.json').write_text(json.dumps(report, ensure_ascii=False, indent=2))
          print(summary(report))
          print(f'FULL SCAN SECONDS: {elapsed:.1f}')
          active = [s for s in cfg['shops'] if s.get('enabled', True)]
          assert len(report['shops']) + len(report['errors']) == len(active), 'Not every source attempted'
          passed = {s['shop'] for s in report['shops']}
          assert all(s['id'] in passed for s in active if s.get('audit_checked_on')), 'New source failed'
          assert elapsed < 360, 'Full catalog audit exceeded six minute budget'
          # The operational five-minute cadence uses Fast Watch, not the full audit.
          started = time.monotonic()
          client = Client()
          try:
              fast_report = fast_run(cfg, audit_state, client, ADAPTERS)
          finally:
              client.close()
          fast_elapsed = time.monotonic() - started
          Path('fast-scan-check.json').write_text(json.dumps(fast_report, ensure_ascii=False, indent=2))
          print(summary(fast_report))
          print(f'FAST SCAN SECONDS: {fast_elapsed:.1f}')
          assert fast_elapsed < 240, 'Fast Watch exceeded four minute budget'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-scan-check
          path: |
            scan-check.json
            fast-scan-check.json
          retention-days: 7
