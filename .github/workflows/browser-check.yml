name: Browser source check
on:
  push:
    branches: [main]
    paths:
      - 'tcg_bot/browser.py'
      - 'tcg_bot/http.py'
      - 'scripts/check_browser.py'
      - 'requirements-browser.txt'
      - '.github/workflows/browser-check.yml'
  pull_request:
    paths: ['tcg_bot/**', 'scripts/check_browser.py', '.github/workflows/browser-check.yml', 'requirements-browser.txt']
  workflow_dispatch:
env:
  PYTHONUTF8: '1'
permissions:
  contents: read
jobs:
  check:
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -q
      - run: python scripts/check_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-access-${{ matrix.os }}
          path: browser-report.json
          retention-days: 7
