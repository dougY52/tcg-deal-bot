name: Browser source check
on:
  push:
    branches: [main]
    paths:
      - 'tcg_bot/browser.py'
      - 'tcg_bot/http.py'
      - 'scripts/check_browser.py'
      - 'tcg_bot/pokemon_center_gate.py'
      - 'tcg_bot/pc_queue_dom.js'
      - 'requirements-browser.txt'
      - '.github/workflows/browser-check.yml'
  pull_request:
    paths: ['tcg_bot/**', 'scripts/check_browser.py', '.github/workflows/browser-check.yml', 'requirements-browser.txt']
  workflow_dispatch:
    inputs:
      pc_transport_test:
        description: 'One-off Pokemon Center DE transport test, without Discord'
        type: boolean
        default: false
      pc_gate_test:
        description: 'One-page DE test (at most 125 free credits, no Discord)'
        type: boolean
        default: false
      pc_discord_test:
        description: 'Send ONE clearly marked simulated DE queue message to Discord (zero scrape credits)'
        type: boolean
        default: false
env:
  PYTHONUTF8: '1'
permissions:
  contents: read
jobs:
  check:
    if: github.event.repository.private == false && !inputs.pc_transport_test && !inputs.pc_gate_test && !inputs.pc_discord_test && !contains(github.event.head_commit.message, '[pc-transport-test]') && !contains(github.event.head_commit.message, '[pc-gate-test]') && !contains(github.event.head_commit.message, '[delivery-audit]')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      TCG_BROWSER_CHANNEL: ${{ matrix.os == 'ubuntu-24.04' && 'chrome' || '' }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --timeout 30 --retries 2 -r requirements-browser.txt
      - if: runner.os == 'Windows'
        run: python -m playwright install chromium
      - run: python -m scripts.check_browser_runtime
      - run: node cloudflare/mms-reader/test.mjs
      - run: python -m unittest discover -s tests -q
      - run: python scripts/check_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-access-${{ matrix.os }}
          path: browser-report.json
          retention-days: 7
  pc-transport:
    if: github.event.repository.private == false && (inputs.pc_transport_test || (github.event_name == 'push' && contains(github.event.head_commit.message, '[pc-transport-test]')))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --timeout 30 --retries 1 -r requirements-browser.txt curl_cffi==0.17.0
      - run: python -m unittest discover -s tests -p 'test_pokemon_center_*.py' -q
      - if: runner.os == 'Linux'
        run: xvfb-run -a python -m scripts.probe_pc_transport --headed
      - if: runner.os == 'Windows'
        run: python -m scripts.probe_pc_transport --headed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pc-transport-${{ matrix.os }}
          path: pc-transport-report.json
          retention-days: 7
  pc-gate:
    if: github.event.repository.private == false && (inputs.pc_gate_test || (github.event_name == 'push' && contains(github.event.head_commit.message, '[pc-gate-test]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --timeout 30 --retries 1 -r requirements-browser.txt
      - name: Replay queue notices in Chrome without shop requests
        env:
          TCG_TEST_PC_DOM: '1'
        run: python -m unittest discover -s tests -p 'test_pokemon_center_*.py' -q
      - name: Read public signal and one DE page without Discord
        env:
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
        run: python -m scripts.probe_pc_gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pc-gate-probe
          path: pc-gate-probe.json
          retention-days: 7
  pc-discord-test:
    name: One marked Discord queue simulation
    if: github.event.repository.private == false && github.event_name == 'workflow_dispatch' && inputs.pc_discord_test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: tcg-pc-discord-simulation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --timeout 30 --retries 1 -r requirements-browser.txt
      - run: python -m unittest discover -s tests -p 'test_pokemon_center_discord.py' -q
      - name: Simulate DE queue and send one clearly marked test
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
        run: python -m scripts.test_pc_discord --send-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pc-discord-test
          path: pc-discord-test-report.json
          retention-days: 7
